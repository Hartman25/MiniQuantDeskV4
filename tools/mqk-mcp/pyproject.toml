[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mqk-readonly-mcp"
version = "0.1.0"
description = "Read-only MCP server for local MiniQuantDesk repository inspection"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0"]

[project.scripts]
mqk-readonly-mcp = "mqk_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
