[package]
name = "mqk-db"
version = "0.0.1"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DEP-GOV-01: workspace = true so sqlx upgrade propagates automatically.
# tls-native-tls hoisted into workspace features (core-rs/Cargo.toml).
sqlx.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[features]
# Enables `OutboxClaimToken::for_test`. MUST NOT be activated in production
# Cargo invocations. Only test crates should list this in [dev-dependencies].
testkit = []

# RT-1: Enables `outbox_claim_batch` + `ClaimedOutboxRow`.
# MUST be listed ONLY in `mqk-runtime`'s [dependencies]. Every other crate
# (daemon, cli, strategy, …) must leave this feature absent so that the
# single-dispatcher invariant is enforced at compile time.
# Daemon/CLI depend on mqk-db WITHOUT this feature; any attempt to call
# outbox_claim_batch from those crates produces:
#   error[E0425]: cannot find function `outbox_claim_batch` in module `mqk_db`
runtime-claim = []

# Positive prover: OutboxClaimToken forge-resistance (FD-1).
# Run: cargo test -p mqk-db --features testkit --test prover_claim_token_unforgeable
[[test]]
name = "prover_claim_token_unforgeable"
required-features = ["testkit"]

# RT-1 positive prover: outbox_claim_batch accessible under runtime-claim.
# Run: cargo test -p mqk-db --features runtime-claim --test prover_outbox_claim_rt1
[[test]]
name = "prover_outbox_claim_rt1"
path = "tests/prover_outbox_claim_rt1.rs"
required-features = ["runtime-claim"]

# RT-1: these four tests call outbox_claim_batch directly and therefore require
# the testkit feature (which mqk-testkit activates via its dev-dependencies).
# Without required-features, cargo test --workspace would try to compile them
# without any feature active and fail because outbox_claim_batch is gated.
[[test]]
name = "scenario_outbox_claim_lock_prevents_double_send"
path = "tests/scenario_outbox_claim_lock_prevents_double_send.rs"
required-features = ["testkit"]

[[test]]
name = "scenario_stale_claim_recovery"
path = "tests/scenario_stale_claim_recovery.rs"
required-features = ["testkit"]

[[test]]
name = "scenario_recovery_query_returns_pending_outbox"
path = "tests/scenario_recovery_query_returns_pending_outbox.rs"
required-features = ["testkit"]

[[test]]
name = "scenario_outbox_first_enforced"
path = "tests/scenario_outbox_first_enforced.rs"
required-features = ["testkit"]

# PRE-SOAK-RUNTIME-HALT-FENCE-CAS-01: halt_and_disarm_run_if_active asserts
# on the global sys_arm_state singleton, so it needs a disposable per-test
# database (mqk_db::run_isolated), which requires testkit.
[[test]]
name = "scenario_runtime_halt_fence_cas_01"
path = "tests/scenario_runtime_halt_fence_cas_01.rs"
required-features = ["testkit"]

# PRE-SOAK-DAEMON-SUPERVISOR-HALT-FENCE-CLOSURE-01: enforce_deadman_or_halt
# now routes through halt_and_disarm_run_if_active, which also touches the
# global sys_arm_state singleton, so this test moved to a disposable
# per-test database (mqk_db::run_isolated), which requires testkit.
[[test]]
name = "scenario_deadman_enforces_halt"
path = "tests/scenario_deadman_enforces_halt.rs"
required-features = ["testkit"]

# FULL-AUDIT-SAFE-IGNORED-AND-SHARED-DB-FINAL-CLOSURE-01 Part 3: DB-backed
# proofs for the hardened disposable-per-test-database helper.
# Run: MQK_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5434/mqk_test \
#      cargo test -p mqk-db --features testkit --test test_support_disposable_db \
#      -- --include-ignored --test-threads=1
[[test]]
name = "test_support_disposable_db"
path = "tests/test_support_disposable_db.rs"
required-features = ["testkit"]

# PAPER-SOAK-REPAIR-20260819-ORPHANED-RUN-RECOVERY-01: stop_run_if_evidence_clean
# proof tests use mqk_db::run_isolated, which requires testkit.
# Run: MQK_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5434/mqk_test \
#      cargo test -p mqk-db --features testkit \
#      --test scenario_stop_run_if_evidence_clean_20260819 \
#      -- --include-ignored --test-threads=1
[[test]]
name = "scenario_stop_run_if_evidence_clean_20260819"
path = "tests/scenario_stop_run_if_evidence_clean_20260819.rs"
required-features = ["testkit"]

# PAPER-SOAK-OUTBOX-ENQUEUE-RUN-STATE-FENCE-01: outbox_enqueue_for_running_run
# proof tests use mqk_db::run_isolated, which requires testkit.
# Run: MQK_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5434/mqk_test \
#      cargo test -p mqk-db --features testkit \
#      --test scenario_outbox_enqueue_run_state_fence_01 \
#      -- --include-ignored --test-threads=1
[[test]]
name = "scenario_outbox_enqueue_run_state_fence_01"
path = "tests/scenario_outbox_enqueue_run_state_fence_01.rs"
required-features = ["testkit"]

[dev-dependencies]
tempfile = "3"
