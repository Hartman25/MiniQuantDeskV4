[package]
name = "mqk-broker-alpaca"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

mqk-execution = { path = "../mqk-execution" }
mqk-schemas = { path = "../mqk-schemas" }

# reqwest async client: no embedded runtime, no blocking feature.
# HTTP I/O is driven by the caller's Tokio runtime via run_async inside the adapter.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# tokio: required for Handle::try_current, block_in_place, and Builder in run_async.
tokio = { workspace = true }

[features]
# Hermetic-test authority: lets a loopback mock server stand in for the Paper
# REST endpoint. Enabled ONLY through a [dev-dependencies] entry of a test crate
# (mqk-daemon); production builds never enable it, so a production Paper
# deployment cannot accept an arbitrary loopback URL as proven Paper. Guarded by
# scripts/guards/check_testkit_feature_not_default.sh.
testkit = []

[dev-dependencies]
# Activates BrokerInvokeToken::for_test() for live adapter tests.
mqk-execution = { path = "../mqk-execution", features = ["testkit"] }
serde_json.workspace = true
httpmock = "0.7"
