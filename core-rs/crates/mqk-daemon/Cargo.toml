[package]
name = "mqk-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mqk-daemon"
path = "src/main.rs"

[lib]
name = "mqk_daemon"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
# PATCH S1: dev-time .env.local bootstrap
dotenvy.workspace = true
serde.workspace = true
# IR7 (DYNAMIC-STRATEGY-SYMBOL-SELECTION-01): `raw_value` lets us capture the
# exact raw JSON numeric token for a `scanner_score` field without altering
# how any other type in this crate (or the workspace's shared serde_json)
# deserializes numbers -- unlike `arbitrary_precision`, it changes nothing
# about existing `f64`/`Value` behavior; it only adds the opt-in
# `RawValue` capability this crate's read-side score canonicalizer uses.
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["signal", "time", "net"] }
uuid.workspace = true

axum.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true

# ✅ for BroadcastStream
tokio-stream.workspace = true

# DB access (optional now, but you'll want it)
sqlx.workspace = true

# Your internal crates (hook these in as you wire real status/control)
mqk-db = { path = "../mqk-db" }
mqk-testkit = { path = "../mqk-testkit" }
mqk-integrity = { path = "../mqk-integrity" }
mqk-audit = { path = "../mqk-audit" }
mqk-schemas = { path = "../mqk-schemas" }
mqk-reconcile = { path = "../mqk-reconcile" }
mqk-runtime = { path = "../mqk-runtime" }
# B1B: strategy types needed for invoke_native_strategy_on_bar_from_signal return type.
mqk-strategy = { path = "../mqk-strategy" }
mqk-execution = { path = "../mqk-execution" }
mqk-broker-alpaca = { path = "../mqk-broker-alpaca" }
mqk-broker-paper = { path = "../mqk-broker-paper" }
mqk-portfolio = { path = "../mqk-portfolio" }
# BACKTEST-DAEMON-JOBS-01: offline backtest job API (no broker, no live execution)
mqk-backtest = { path = "../mqk-backtest" }
mqk-artifacts = { path = "../mqk-artifacts" }
# DATA-INGEST-GUI-SYNC-ALL-01: read-only instrument registry access for tracked-equities route
mqk-md = { path = "../mqk-md" }
reqwest.workspace = true
# BRK-00R-05: Alpaca paper WebSocket transport.
tokio-tungstenite.workspace = true
# STRATEGY-PROMOTION-REGISTRY-01C: evidence-fingerprint digest for promotion
# approval evidence. Reuses the same crate+version pairing already vetted
# elsewhere in the workspace (mqk-audit, mqk-config) — not a new hashing
# dependency.
sha2 = "0.10"
hex = "0.4"
# DAILY-DATA-READINESS-01C-CLOSURE-REPAIR-01 (REPAIR 3): RuntimeStartEffects
# seam in daily_data_readiness.rs / state/lifecycle.rs is production code, so
# this must be a normal dependency, not dev-only. Previously only used by
# test fakes (dev-dependencies); now also used by
# `ProductionRuntimeStartEffects`.
async-trait = "0.1"

[features]
# FULL-AUDIT-SAFE-IGNORED-AND-SHARED-DB-FINAL-CLOSURE-01 Part 1: compile-time
# boundary for the 9 MANUAL_EXTERNAL tests that require real Alpaca
# credentials (see scripts/test/ignored_test_inventory.csv). Off by default:
# default `cargo test`, the canonical safe-ignored runner, and CI never pass
# this feature, so these 9 functions do not even exist in the compiled test
# binary in the normal case. An operator proving these manually must pass
# --features manual-external explicitly, AND (see the functions themselves)
# set MQK_ALLOW_MANUAL_EXTERNAL_ORDER_TESTS=1 at runtime -- two independent,
# separately-named gates before any real broker adapter can be constructed.
manual-external = []

[dev-dependencies]
# Required for in-process Axum router testing via tower::ServiceExt::oneshot()
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
bytes = "1"
# B6: temp policy files for capital budget gate proof tests
tempfile = "3"
# FULL-AUDIT-SAFE-IGNORED-AND-SHARED-DB-FINAL-CLOSURE-01 Part 3: activates
# mqk_db::run_isolated / create_disposable_test_db / DisposableTestDb
# (mqk-db's test_support module) for this crate's own tests and hermetic
# `#[cfg(test)]` in-crate proofs. MUST NOT be moved to [dependencies] --
# that would compile the disposable-database helper into the production
# `mqk-daemon` binary. See scripts/guards/check_disposable_db_not_in_production.sh.
mqk-db = { path = "../mqk-db", features = ["testkit"] }