[package]
name = "mqk-promotion"
version = "0.1.0"
edition = "2021"

[dependencies]
mqk-artifacts = { path = "../mqk-artifacts" }    # Patch B6: RunManifest
mqk-audit = { path = "../mqk-audit" }            # Patch B6: verify_hash_chain_str
mqk-backtest = { path = "../mqk-backtest" }
mqk-portfolio = { path = "../mqk-portfolio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"   # P7C-REPAIR-01: hash-bind verified OOS evidence to actual artifact bytes
hex = "0.4"     # P7C-REPAIR-01
uuid = { version = "1", features = ["serde", "v5"] }  # RunProvenance + provenance gates
rusqlite = { version = "0.30", features = ["bundled"] }  # P7C-REPAIR-03: read-only durable Research registry access

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }      # Patch B6 tests: AuditWriter::append
tempfile = "3"    # P7C-REPAIR-03 tests: synthetic registry DB fixtures
chrono = { version = "0.4" }   # BKT-PROMOTION-ARTIFACT-AUTHORITY-01 tests: init_run_artifacts now_utc
mqk-strategy = { path = "../mqk-strategy" }   # BKT-PROMOTION-ARTIFACT-AUTHORITY-01 tests: real BacktestEngine fixture
