[package]
name = "mqk-cli"
version = "0.0.1"
edition = "2021"

[features]
# RT-2: enables run_execute (NullBroker/PassGate stubs) and BrokerGateway::for_test.
# RT-8: also gates run_loop (mqk_testkit::Orchestrator) out of the production binary.
# Propagates testkit to mqk-execution + mqk-runtime so test-only wiring is callable.
# MUST NOT be enabled in production deployments.
testkit = [
  "dep:mqk-testkit",
  "mqk-execution/testkit",
  "mqk-runtime/testkit",
]

[[bin]]
name = "mqk_paper_loop"
path = "src/bin/mqk_paper_loop.rs"
required-features = ["testkit"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
# PATCH S1: dev-time .env.local bootstrap
dotenvy.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# MARKET-DATA-PROVIDER-PROVENANCE-01: promoted from dev-dependencies — the
# per-symbol truthful-provenance ingest helper in commands/md.rs names
# `sqlx::PgPool` directly in production code, not just in tests.
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# W06-P9-CANONICAL-RESEARCH-REPLAY-CLI-01: content-hash re-verification of a
# Research OOS replay bundle before consuming it. Same versions already used
# by mqk-artifacts/mqk-strategy elsewhere in this workspace.
sha2 = "0.10"
hex = "0.4"

# Internal crates: use path deps (do NOT rely on workspace.dependencies.* being defined)
mqk-audit = { path = "../mqk-audit" }
mqk-artifacts = { path = "../mqk-artifacts" }
mqk-config = { path = "../mqk-config" }
mqk-db = { path = "../mqk-db" }
mqk-backtest = { path = "../mqk-backtest" }
mqk-execution = { path = "../mqk-execution" }
mqk-integrity = { path = "../mqk-integrity" }
mqk-strategy = { path = "../mqk-strategy" }
mqk-md = { path = "../mqk-md" }
mqk-testkit = { path = "../mqk-testkit", optional = true }
mqk-runtime = { path = "../mqk-runtime" }
mqk-portfolio = { path = "../mqk-portfolio" }
mqk-reconcile = { path = "../mqk-reconcile" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# sqlx itself moved to [dependencies] above (MARKET-DATA-PROVIDER-PROVENANCE-01).
# CLI-DAEMON-CONTROL-PASSTHROUGH-01: same hermetic HTTP-mock seam mqk-md
# already uses (crates/mqk-md/Cargo.toml) for provider-adapter tests.
httpmock = "0.7"
